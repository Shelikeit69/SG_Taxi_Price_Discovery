<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Singapore taxi fare reference</title>
<style>
  :root { --ink: #1f1e1c; --muted: #5f5e5a; --line: #d3d1c7; --bg: #faf9f5; --card: #fff; --accent: #b4441e; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); background: var(--bg); }
  main { max-width: 34rem; margin: 0 auto; padding: 1rem; }
  h1 { font-size: 1.35rem; margin: 0.5rem 0; }
  p { margin: 0.5rem 0; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  form { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; display: grid; gap: 0.75rem; }
  label { display: grid; gap: 0.25rem; font-weight: 600; font-size: 0.95rem; }
  select, input, button { font: inherit; width: 100%; min-height: 2.75rem; border: 1px solid var(--line); border-radius: 8px; padding: 0.5rem; background: #fff; color: var(--ink); }
  button { background: #f1efe8; cursor: pointer; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
  #result { margin-top: 1rem; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; }
  #total { font-size: 2.25rem; font-weight: 700; margin: 0.25rem 0; }
  ul { margin: 0.25rem 0 0; padding-left: 1.25rem; }
  #status { min-height: 1.5em; }
  .warn { color: var(--accent); }
  .submit { margin-top: 1rem; }
  .submit h2 { font-size: 1.1rem; margin: 0; }
  label.check { display: flex; gap: 0.5rem; align-items: center; font-weight: 400; }
  label.check input { width: auto; min-height: 0; }
  details { font-size: 0.9rem; }
  .ok { color: #2f6b2f; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 0.75rem; }
  button.lang { width: auto; min-height: 2.25rem; padding: 0.25rem 0.75rem; font-size: 0.9rem; flex-shrink: 0; }
</style>
</head>
<body>
<main>
  <div class="top"><h1 id="title"></h1><button type="button" id="langBtn" class="lang"></button></div>
  <p id="intro" class="muted"></p>
  <form id="form" novalidate>
    <label><span id="fromLabel"></span><select id="origin"></select></label>
    <button type="button" id="locate"></button>
    <p id="status" class="muted" role="status" aria-live="polite"></p>
    <label><span id="toLabel"></span><select id="dest"></select></label>
    <p id="destHint" class="muted"></p>
    <div class="row">
      <label><span id="timeLabel"></span><input id="time" type="time" step="60"></label>
      <label><span id="dayLabel"></span><select id="day"><option value="wd"></option><option value="we"></option></select></label>
    </div>
  </form>
  <section id="result" aria-live="polite">
    <p id="resultLabel" class="muted"></p>
    <p id="total"></p>
    <p id="message"></p>
    <ul id="details"></ul>
    <p id="estimate" class="muted"></p>
    <p id="notIncludedTitle"><strong></strong></p>
    <ul id="notIncluded" class="muted"></ul>
    <p id="rates" class="muted"></p>
    <p id="saved" class="muted"></p>
  </section>
  <form id="submitForm" class="submit" novalidate>
    <h2 id="submitTitle"></h2>
    <p id="submitIntro" class="muted"></p>
    <label><span id="platformLabel"></span><select id="platform"></select></label>
    <p id="streetHailHint" class="muted" hidden></p>
    <label><span id="bookedFareLabel"></span><input id="bookedFare" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00"></label>
    <label class="check"><input id="discount" type="checkbox"><span id="discountLabel"></span></label>
    <p id="rideTimeNote" class="muted"></p>
    <p id="consent" class="muted"></p>
    <button type="submit" id="submitBtn"></button>
    <p id="submitStatus" role="status" aria-live="polite"></p>
  </form>
</main>
<script src="../src/surcharge.js"></script>
<script src="../src/fare.js"></script>
<script src="../src/route.js"></script>
<script src="../src/text.js"></script>
<script src="../src/submission.js"></script>
<script src="app.js"></script>
</body>
</html>
